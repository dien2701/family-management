      summary: Thêm người gốc
      description: |
        Chỉ Admin. Đưa một thành viên chưa có trên cây vào làm gốc mới (Đời 01). Có thể có nhiều gốc; gốc mới xếp cuối.
        Lỗi: 409 `MEMBER_ALREADY_ON_TREE`.
      operationId: addTreeRoot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TreeMemberInput'
      responses:
        '201':
          description: Đã thêm, trả ô mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeNode'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/tree/nodes/{id}/children:
    post:
      tags:
        - tree
      summary: Thêm con vào một ô
      description: |
        Chỉ Admin. Con mới xếp cuối các anh em. Cặp cha–mẹ được xác định như sau:
        - bấm trên **ô vợ/chồng** thì cặp là ô đó cùng người thuộc dòng của nó (`coParentNodeId`, nếu gửi, phải là chính ô đó);
        - bấm trên ô thuộc dòng có **≥ 2 vợ/chồng** thì bắt buộc gửi `coParentNodeId`, thiếu thì 409 `TREE_NEEDS_CO_PARENT`;
        - có đúng 1 vợ/chồng thì tự nhận cặp đó; không có thì con chỉ thuộc một mình cha/mẹ.

        Lỗi: 404 `TREE_NODE_NOT_FOUND`; 409 `MEMBER_ALREADY_ON_TREE`, `TREE_INVALID_CO_PARENT`, `TREE_NEEDS_CO_PARENT`.
      operationId: addTreeChild
      parameters:
        - $ref: '#/components/parameters/TreeNodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TreeChildInput'
      responses:
        '201':
          description: Đã thêm, trả ô mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeNode'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/tree/nodes/{id}/spouses:
