  /api/calendar/upcoming:
    get:
      tags:
        - calendar
      summary: Các sự kiện sắp diễn ra
      description: |
        Giỗ, sinh nhật và sự kiện chung có ngày dương từ **hôm nay** (giờ +7, `daysUntil = 0`) đến hôm nay + `days` ngày.
        Ngày cúng theo quy tắc IDEA §7 (ngày ghi đè, tháng nhuận, tháng thiếu). Xếp theo ngày dương, cùng ngày thì Giỗ, Sinh nhật, Sự kiện chung rồi theo tên.
      operationId: upcomingOccurrences
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            format: int32
            enum:
              - 7
              - 15
              - 30
              - 90
              - 365
            default: 30
        - name: type
          in: query
          description: Chỉ lấy một loại; bỏ trống là cả ba loại
          required: false
          schema:
            $ref: '#/components/schemas/EventType'
        - name: sort
          in: query
          description: '`asc` gần nhất trước (mặc định), `desc` xa nhất trước'
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarOccurrence'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/calendar/month:
    get:
      tags:
        - calendar
      summary: Lịch một tháng
      description: |
        Từng ngày của một tháng kèm sự kiện của ngày đó. `mode = solar`: `year`/`month` là tháng dương. `mode = lunar`:
        là tháng âm (`leap = true` cho tháng nhuận), các ngày đi từ mùng 1 đến hết tháng âm đó, mỗi ngày kèm ngày dương.
      operationId: calendarMonth
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            format: int32
        - name: month
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 12
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum:
              - solar
              - lunar
            default: solar
        - name: leap
          in: query
          description: Chỉ có nghĩa khi `mode = lunar`
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarMonth'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/calendar/recent:
    get:
      tags:
        - calendar
      summary: Các sự kiện vừa diễn ra
      description: Các sự kiện có ngày dương **trước hôm nay** (trong vòng một năm), gần nhất trước (`daysUntil` âm). Dùng cho dashboard.
      operationId: recentOccurrences
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarOccurrence'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
