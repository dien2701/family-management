openapi: 3.1.0
info:
  title: Tộc Phả API
  version: v2
  description: |
    Hợp đồng API của Tộc Phả (bản chốt v2: một gia phả chung, hai vai trò Admin và User).
    File này viết tay và là **nguồn sự thật** (DECISIONS #70): frontend sinh kiểu TypeScript từ đây
    (`npm run gen:api`), backend phải khớp (test hợp đồng từ Đợt 26). Muốn đổi API thì sửa file này trước.

    Khởi tạo từ `/v3/api-docs` của backend Đợt 8, đã bỏ `/api/family/**`. Các phần chưa có backend
    (mọi thứ dưới thẻ `members`) do lớp giả lập của frontend phục vụ cho tới Đợt 26–39.

    Mọi API nghiệp vụ chỉ nhận tài khoản đã được duyệt (403 `ACCOUNT_NOT_APPROVED`). Lỗi luôn là `ProblemDetail`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: 'Cùng origin với frontend (dev: proxy /api sang :8080)'
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Đăng ký, đăng nhập, OTP, refresh token
  - name: me
    description: Tài khoản đang đăng nhập
  - name: admin-accounts
    description: Duyệt và quản lý tài khoản (chỉ Admin)
  - name: calendar
    description: Đổi lịch âm - dương, các sự kiện sắp tới và lịch tháng
  - name: events
    description: Sự kiện chung (giỗ và sinh nhật tự sinh từ hồ sơ thành viên)
  - name: members
    description: Thành viên gia phả
  - name: files
    description: Tải tệp lên Cloudinary bằng chữ ký do backend cấp
  - name: relatives
    description: Danh sách người thân trong hồ sơ thành viên (một chiều, tách khỏi cây)
  - name: member-links
    description: Liên kết tài khoản với thành viên ("Tôi là ai"), quan hệ 1–1
  - name: tree
    description: Cây gia phả do Admin dựng tay (các ô, vợ/chồng, cha mẹ–con)
  - name: reports
    description: Báo cáo và xuất dữ liệu
  - name: ai
    description: Trợ lý AI (chỉ đọc dữ liệu, không tự ghi)
  - name: admin-settings
    description: Cấu hình hệ thống (chỉ Admin)
  - name: admin-deleted-members
    description: Thành viên đã xóa (chỉ Admin)
paths:
  /api/me/consent:
    post:
      tags:
        - me
      summary: Ghi nhận đồng ý chính sách dữ liệu cá nhân
      operationId: consent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/verify-reset-otp:
    post:
      tags:
        - auth
      summary: Kiểm tra OTP đặt lại mật khẩu (chưa tiêu OTP)
      operationId: verifyResetOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
        required: true
      security: []
      responses:
        '200':
          description: Thành công
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/verify-otp:
    post:
      tags:
        - auth
      summary: Xác thực OTP đăng ký và đăng nhập luôn
      operationId: verifyOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
        required: true
      security: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/reset-password:
    post:
      tags:
        - auth
      summary: Đặt mật khẩu mới bằng OTP
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      security: []
      responses:
        '200':
          description: Thành công
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/change-password:
    post:
      tags:
        - auth
      summary: Đổi mật khẩu khi đã đăng nhập
      description: Cần mật khẩu hiện tại. Thu hồi mọi refresh token khác của tài khoản. Tài khoản chỉ đăng nhập bằng Google (chưa có mật khẩu) nhận 409.
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '204':
          description: Đã đổi mật khẩu
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/resend-otp:
    post:
      tags:
        - auth
      summary: Gửi lại OTP đăng ký
      operationId: resendOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/register:
    post:
      tags:
        - auth
      summary: Đăng ký bằng email và gửi OTP
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/refresh:
    post:
      tags:
        - auth
      summary: Đổi refresh cookie lấy access token mới
      operationId: refresh
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          schema:
            type: string
      security: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/logout:
    post:
      tags:
        - auth
      summary: Đăng xuất, thu hồi refresh token
      operationId: logout
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          schema:
            type: string
      security: []
      responses:
        '200':
          description: Thành công
  /api/auth/login:
    post:
      tags:
        - auth
      summary: Đăng nhập bằng email và mật khẩu
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/google:
    post:
      tags:
        - auth
      summary: Đăng nhập bằng Google ID token
      operationId: google
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
        required: true
      security: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/forgot-password:
    post:
      tags:
        - auth
      summary: Quên mật khẩu, gửi OTP đặt lại
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/admin/accounts/{id}/unlock:
    post:
      tags:
        - admin-accounts
      summary: Mở khóa tài khoản
      operationId: unlock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAdminResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/accounts/{id}/revoke-admin:
    post:
      tags:
        - admin-accounts
      summary: Gỡ quyền Admin
      operationId: revokeAdmin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAdminResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/accounts/{id}/reject:
    post:
      tags:
        - admin-accounts
      summary: Từ chối duyệt tài khoản
      operationId: reject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAdminResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/accounts/{id}/lock:
    post:
      tags:
        - admin-accounts
      summary: Khóa tài khoản
      operationId: lock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAdminResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/accounts/{id}/grant-admin:
    post:
      tags:
        - admin-accounts
      summary: Cấp quyền Admin
      operationId: grantAdmin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAdminResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/accounts/{id}/approve:
    post:
      tags:
        - admin-accounts
      summary: Duyệt tài khoản
      operationId: approve
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAdminResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/me:
    get:
      tags:
        - me
      summary: Thông tin tài khoản đang đăng nhập
      operationId: me
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/calendar/lunar-month-info:
    get:
      tags:
        - calendar
      summary: Thông tin một tháng âm
      operationId: lunarMonthInfo
      description: Số ngày (29/30), ngày dương đầu và cuối của một tháng âm, kèm tháng nhuận của năm
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            format: int32
        - name: month
          in: query
          required: true
          schema:
            type: integer
            format: int32
        - name: leap
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LunarMonthInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/calendar/convert:
    get:
      tags:
        - calendar
      summary: Đổi ngày dương và âm
      operationId: convert
      description: Đổi ngày dương sang âm (truyền solar) hoặc âm sang dương (truyền lunarYear, lunarMonth, lunarDay, leap)
      parameters:
        - name: solar
          in: query
          description: Ngày dương, dạng yyyy-MM-dd
          required: false
          schema:
            type: string
            format: date
          example: '2026-02-17'
        - name: lunarYear
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: lunarMonth
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: lunarDay
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: leap
          in: query
          description: Ngày thuộc tháng nhuận
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/accounts:
    get:
      tags:
        - admin-accounts
      summary: Danh sách tài khoản (Admin)
      operationId: list
      parameters:
        - name: approval
          in: query
          required: false
          schema:
            type: string
            enum:
              - WAITING
              - APPROVED
              - REJECTED
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - ACTIVE
              - LOCKED
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum:
              - ADMIN
              - USER
        - name: q
          in: query
          description: Tìm theo họ tên (không phân biệt hoa thường, dấu) hoặc email
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            maximum: 100
            minimum: 1
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseAccountAdminResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/members:
    get:
      tags:
        - members
      summary: Danh sách thành viên
      description: |
        Mọi tài khoản đã duyệt xem được. Tìm theo tên **không cần gõ dấu**. Các bộ lọc kết hợp bằng AND.
        `ageMin`/`ageMax` tính theo năm (còn sống: đến năm hiện tại; đã mất: đến năm mất dương). Người chưa rõ
        năm sinh, hoặc đã mất mà chưa rõ năm mất, không tính được tuổi nên bị loại khi có một trong hai tham số. `generation` và `onTree` lấy từ cây gia phả (cây trống thì
        không ai có đời và mọi người đều `onTree=false`).
      operationId: listMembers
      parameters:
        - name: q
          in: query
          description: Tìm theo họ tên, không phân biệt hoa thường và dấu
          required: false
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          description: |
            `name` tên A-Z (theo cả chuỗi họ tên); `age` lớn tuổi trước, người chưa rõ năm sinh xếp cuối;
            `created` mới thêm trước; `generation` đời nhỏ trước, người chưa lên cây xếp cuối.
          required: false
          schema:
            type: string
            enum:
              - name
              - age
              - created
              - generation
            default: name
        - name: ageMin
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 150
        - name: ageMax
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 150
        - name: generation
          in: query
          description: Đời (độ sâu trên cây, đời 1 là gốc)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: deceased
          in: query
          description: '`true` chỉ người đã mất, `false` chỉ người còn sống'
          required: false
          schema:
            type: boolean
        - name: onTree
          in: query
          description: '`true` chỉ người đã có trên cây, `false` chỉ người chưa có'
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            maximum: 100
            minimum: 1
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - members
      summary: Thêm thành viên
      description: |
        Chỉ Admin. Chỉ `fullName` là bắt buộc. Các trường về việc đã mất (`deathSolar`, `deathLunar`,
        `memorialOverride`, `burialPlace`) chỉ hợp lệ khi `isDeceased = true`, nếu không thì 400 `VALIDATION_ERROR`.
        Ngày mất gửi **một trong hai** (`deathSolar` hoặc `deathLunar`); có cả hai thì dùng `deathSolar`. Khi có năm, máy chủ
        tự tính ngày ở lịch còn lại và trả cả hai; `deathLunar` không có năm thì `deathSolar` là `null`.
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/members/{id}:
    get:
      tags:
        - members
      summary: Chi tiết thành viên
      description: |
        Mọi tài khoản đã duyệt xem được. `phone` và `email` chỉ có trong body khi người gọi là Admin
        hoặc chính chủ hồ sơ (`user.member_id`); với người khác hai trường này **không xuất hiện**.
      operationId: getMember
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - members
      summary: Sửa thành viên
      description: |
        Admin sửa mọi hồ sơ. User đã liên kết "Tôi là ai" chỉ sửa hồ sơ của chính mình (`user.member_id`), có hiệu lực ngay,
        và **không** được đổi nhóm "đã mất" (`isDeceased`, `deathSolar`, `deathLunar`, `memorialOverride`, `burialPlace`):
        khác giá trị hiện có thì 403 `DEATH_FIELDS_ADMIN_ONLY`. Người khác thì 403 `FORBIDDEN`.
        Ảnh đại diện không đổi qua API này mà qua `/api/files/confirm`. Quy tắc dữ liệu như `POST /api/members`.
      operationId: updateMember
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - members
      summary: Xóa thành viên
      description: |
        Chỉ Admin. Bị chặn nếu người đó đang có trên cây (409 `MEMBER_ON_TREE`): phải gỡ khỏi cây trước.
        Khi xóa: xóa các dòng người thân liên quan, gỡ liên kết tài khoản, xóa tệp đính kèm; audit log giữ bản sao đầy đủ.
      operationId: deleteMember
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Đã xóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/files/sign:
