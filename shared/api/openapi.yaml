components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AiDraftId:
      name: id
      in: path
      required: true
      description: '`id` của bản nháp do AI soạn'
      schema:
        type: integer
        format: int64
        minimum: 1
    EventId:
      name: id
      in: path
      required: true
      description: '`id` của sự kiện chung'
      schema:
        type: integer
        format: int64
        minimum: 1
    TreeNodeId:
      name: id
      in: path
      required: true
      description: '`id` của ô trên cây (không phải id thành viên)'
      schema:
        type: integer
        format: int64
        minimum: 1
    MemberId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RelativeId:
      name: relativeId
      in: path
      required: true
      description: '`id` của dòng người thân (không phải id của thành viên được nhắc tới)'
      schema:
        type: integer
        format: int64
        minimum: 1
    LinkRequestId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    ValidationError:
      description: 'Dữ liệu không hợp lệ (`VALIDATION_ERROR`, `MALFORMED_REQUEST`, lỗi lịch âm...)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Chưa đăng nhập, phiên hết hạn hoặc sai thông tin đăng nhập (`UNAUTHENTICATED`, `INVALID_CREDENTIALS`...)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Không có quyền (`FORBIDDEN`), tài khoản chưa được duyệt (`ACCOUNT_NOT_APPROVED`) hoặc bị khóa (`ACCOUNT_LOCKED`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Không tìm thấy (`ACCOUNT_NOT_FOUND`, `MEMBER_NOT_FOUND`, `EVENT_NOT_FOUND`, `TREE_NODE_NOT_FOUND`, `RELATIVE_NOT_FOUND`, `LINK_REQUEST_NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: 'Xung đột trạng thái (`SELF_ACTION_FORBIDDEN`, `LAST_ADMIN`, `INVALID_ACCOUNT_STATE`, `MEMBER_ON_TREE`, `RELATIVE_EXISTS`, `MEMBER_ALREADY_LINKED`, `ACCOUNT_ALREADY_LINKED`, `LINK_REQUEST_EXISTS`, `LINK_REQUEST_NOT_PENDING`, `NOT_LINKED`, các mã cây `MEMBER_ALREADY_ON_TREE`, `TREE_*`)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TooManyRequests:
      description: Vượt giới hạn tần suất hoặc tài khoản bị khóa đăng nhập tạm (`LOGIN_LOCKED`, `RATE_LIMITED`, `OTP_RATE_LIMITED`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    ProblemDetail:
      type: object
      description: Lỗi theo RFC 9457; `detail` là thông báo tiếng Việt hiển thị được cho người dùng.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Mã lỗi máy đọc được, ví dụ `ACCOUNT_NOT_APPROVED`, `MEMBER_NOT_FOUND`.
        errors:
          type: array
          description: Lỗi theo từng trường (chỉ có khi `code = VALIDATION_ERROR` hoặc lỗi lịch âm).
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
        - field
        - message
    SolarDate:
      type: object
      description: Ngày dương đầy đủ.
      properties:
        year:
          type: integer
          format: int32
        month:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
        day:
          type: integer
          format: int32
          minimum: 1
          maximum: 31
      required:
        - year
        - month
        - day
    MemberLunarDate:
      type: object
      description: Ngày âm; `year` bỏ trống nghĩa là chỉ biết ngày/tháng (không tính "giỗ lần thứ N").
      properties:
        day:
          type: integer
          format: int32
          minimum: 1
          maximum: 30
        month:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
        leap:
          type: boolean
          description: Ngày thuộc tháng nhuận
        year:
          type:
            - integer
            - 'null'
          format: int32
      required:
        - day
        - month
        - leap
    MemberBirth:
      type: object
      description: Ngày sinh; được phép chỉ có năm. `calendar` là lịch dùng để tính sinh nhật hằng năm của người này.
      properties:
        year:
          type:
            - integer
            - 'null'
          format: int32
        month:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 1
          maximum: 12
        day:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 1
          maximum: 31
        calendar:
          type: string
          enum:
            - SOLAR
            - LUNAR
          default: SOLAR
        leap:
          type: boolean
          description: Chỉ có nghĩa khi `calendar = LUNAR`
      required:
        - calendar
        - leap
    MemorialOverride:
      type: object
      description: Ngày giỗ ghi đè (âm lịch, không nhuận), dùng thay cho ngày mất khi gia đình cúng ngày khác.
      properties:
        day:
          type: integer
          format: int32
          minimum: 1
          maximum: 30
        month:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
      required:
        - day
        - month
    MemberSummary:
      type: object
      description: Dòng trong danh sách thành viên. Họ tên ghi nguyên văn, kể cả "Cụ", "Ông", "Bà", "(Tức ...)".
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        gender:
          type:
            - string
            - 'null'
          enum:
            - M
            - F
            - null
          description: Được để trống
        avatarUrl:
          type:
            - string
            - 'null'
        labels:
          type: array
          description: Nhãn đặc biệt, ví dụ "Liệt sỹ"
          items:
            type: string
        birthYear:
          type:
            - integer
            - 'null'
          format: int32
        isDeceased:
          type: boolean
        deathYear:
          type:
            - integer
            - 'null'
          format: int32
          description: Năm mất theo dương lịch (nếu biết)
        generation:
          type:
            - integer
            - 'null'
          format: int32
          description: Đời = độ sâu trên cây; `null` khi chưa có trên cây
        onTree:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fullName
        - gender
        - avatarUrl
        - labels
        - birthYear
        - isDeceased
        - deathYear
        - generation
        - onTree
        - createdAt
    MemberDetail:
      description: Hồ sơ đầy đủ của một thành viên.
      allOf:
        - $ref: '#/components/schemas/MemberSummary'
        - type: object
          properties:
            tabooName:
              type:
                - string
                - 'null'
              description: Tên húy
            phone:
              type:
                - string
                - 'null'
              description: Chỉ có khi người gọi là Admin hoặc chính chủ; người khác không nhận trường này.
            email:
              type:
                - string
                - 'null'
              description: Chỉ có khi người gọi là Admin hoặc chính chủ; người khác không nhận trường này.
            biography:
              type:
                - string
                - 'null'
            birth:
              oneOf:
                - $ref: '#/components/schemas/MemberBirth'
                - type: 'null'
              description: '`null` khi chưa biết gì về ngày sinh'
            deathSolar:
              oneOf:
                - $ref: '#/components/schemas/SolarDate'
                - type: 'null'
              description: Ngày mất theo dương; tự tính từ ngày mất âm khi có năm, `null` khi chưa có.
            deathLunar:
              oneOf:
                - $ref: '#/components/schemas/MemberLunarDate'
                - type: 'null'
              description: Ngày mất theo âm (nguồn nhập của dữ liệu ban đầu); `null` khi chưa có.
            memorialOverride:
              oneOf:
                - $ref: '#/components/schemas/MemorialOverride'
                - type: 'null'
            burialPlace:
              type:
                - string
                - 'null'
            updatedAt:
              type: string
              format: date-time
          required:
            - tabooName
            - biography
            - birth
            - deathSolar
            - deathLunar
            - memorialOverride
            - burialPlace
            - updatedAt
    MemberInput:
      type: object
      description: |
        Nội dung hồ sơ khi thêm hoặc sửa (PUT thay toàn bộ, trường bỏ trống nghĩa là xóa giá trị).
        Họ tên ghi nguyên văn. Không có `avatarUrl`: ảnh đại diện đổi qua `/api/files/confirm`.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        gender:
          type:
            - string
            - 'null'
          enum:
            - M
            - F
            - null
        tabooName:
          type:
            - string
            - 'null'
          maxLength: 200
        labels:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 50
        biography:
          type:
            - string
            - 'null'
          maxLength: 5000
        phone:
          type:
            - string
            - 'null'
          maxLength: 30
        email:
          type:
            - string
            - 'null'
          maxLength: 254
        birth:
          oneOf:
            - $ref: '#/components/schemas/MemberBirth'
            - type: 'null'
        isDeceased:
          type: boolean
