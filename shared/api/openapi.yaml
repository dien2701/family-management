openapi: 3.1.0
info:
  title: Tộc Phả API
  version: v2
  description: |
    Hợp đồng API của Tộc Phả (bản chốt v2: một gia phả chung, hai vai trò Admin và User).
    File này viết tay và là **nguồn sự thật** (DECISIONS #70): frontend sinh kiểu TypeScript từ đây
    (`npm run gen:api`), backend phải khớp (test hợp đồng từ Đợt 26). Muốn đổi API thì sửa file này trước.

    Khởi tạo từ `/v3/api-docs` của backend Đợt 8, đã bỏ `/api/family/**`. Các phần chưa có backend
    (mọi thứ dưới thẻ `members`) do lớp giả lập của frontend phục vụ cho tới Đợt 26–39.

    Mọi API nghiệp vụ chỉ nhận tài khoản đã được duyệt (403 `ACCOUNT_NOT_APPROVED`). Lỗi luôn là `ProblemDetail`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: 'Cùng origin với frontend (dev: proxy /api sang :8080)'
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Đăng ký, đăng nhập, OTP, refresh token
  - name: me
    description: Tài khoản đang đăng nhập
  - name: admin-accounts
    description: Duyệt và quản lý tài khoản (chỉ Admin)
  - name: calendar
    description: Đổi lịch âm - dương
  - name: members
    description: Thành viên gia phả
  - name: files
    description: Tải tệp lên Cloudinary bằng chữ ký do backend cấp
  - name: relatives
    description: Danh sách người thân trong hồ sơ thành viên (một chiều, tách khỏi cây)
  - name: member-links
    description: Liên kết tài khoản với thành viên ("Tôi là ai"), quan hệ 1–1
  - name: tree
    description: Cây gia phả do Admin dựng tay (các ô, vợ/chồng, cha mẹ–con)
paths:
  /api/me/consent:
    post:
      tags:
        - me
      summary: Ghi nhận đồng ý chính sách dữ liệu cá nhân
      operationId: consent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/verify-reset-otp:
    post:
      tags:
        - auth
      summary: Kiểm tra OTP đặt lại mật khẩu (chưa tiêu OTP)
      operationId: verifyResetOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
        required: true
      security: []
      responses:
        '200':
          description: Thành công
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/verify-otp:
    post:
      tags:
        - auth
      summary: Xác thực OTP đăng ký và đăng nhập luôn
      operationId: verifyOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
        required: true
      security: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/reset-password:
    post:
      tags:
        - auth
      summary: Đặt mật khẩu mới bằng OTP
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      security: []
      responses:
        '200':
          description: Thành công
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/resend-otp:
    post:
      tags:
        - auth
      summary: Gửi lại OTP đăng ký
      operationId: resendOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/register:
    post:
      tags:
        - auth
      summary: Đăng ký bằng email và gửi OTP
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/refresh:
    post:
      tags:
        - auth
      summary: Đổi refresh cookie lấy access token mới
      operationId: refresh
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          schema:
            type: string
      security: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/logout:
    post:
      tags:
        - auth
      summary: Đăng xuất, thu hồi refresh token
      operationId: logout
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          schema:
            type: string
      security: []
      responses:
        '200':
          description: Thành công
  /api/auth/login:
    post:
      tags:
        - auth
      summary: Đăng nhập bằng email và mật khẩu
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/google:
    post:
      tags:
        - auth
      summary: Đăng nhập bằng Google ID token
      operationId: google
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
        required: true
      security: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/forgot-password:
    post:
      tags:
        - auth
      summary: Quên mật khẩu, gửi OTP đặt lại
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/admin/accounts/{id}/unlock:
    post:
      tags:
        - admin-accounts
      summary: Mở khóa tài khoản
      operationId: unlock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAdminResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/accounts/{id}/revoke-admin:
    post:
      tags:
        - admin-accounts
      summary: Gỡ quyền Admin
      operationId: revokeAdmin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAdminResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/accounts/{id}/reject:
    post:
      tags:
        - admin-accounts
      summary: Từ chối duyệt tài khoản
      operationId: reject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAdminResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/accounts/{id}/lock:
    post:
      tags:
        - admin-accounts
      summary: Khóa tài khoản
      operationId: lock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAdminResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/accounts/{id}/grant-admin:
    post:
      tags:
        - admin-accounts
      summary: Cấp quyền Admin
      operationId: grantAdmin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAdminResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/accounts/{id}/approve:
    post:
      tags:
        - admin-accounts
      summary: Duyệt tài khoản
      operationId: approve
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAdminResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/me:
    get:
      tags:
        - me
      summary: Thông tin tài khoản đang đăng nhập
      operationId: me
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/calendar/lunar-month-info:
    get:
      tags:
        - calendar
      summary: Thông tin một tháng âm
      operationId: lunarMonthInfo
      description: Số ngày (29/30), ngày dương đầu và cuối của một tháng âm, kèm tháng nhuận của năm
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            format: int32
        - name: month
          in: query
          required: true
          schema:
            type: integer
            format: int32
        - name: leap
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LunarMonthInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/calendar/convert:
    get:
      tags:
        - calendar
      summary: Đổi ngày dương và âm
      operationId: convert
      description: Đổi ngày dương sang âm (truyền solar) hoặc âm sang dương (truyền lunarYear, lunarMonth, lunarDay, leap)
      parameters:
        - name: solar
          in: query
          description: Ngày dương, dạng yyyy-MM-dd
          required: false
          schema:
            type: string
            format: date
          example: '2026-02-17'
        - name: lunarYear
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: lunarMonth
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: lunarDay
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: leap
          in: query
          description: Ngày thuộc tháng nhuận
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/accounts:
    get:
      tags:
        - admin-accounts
      summary: Danh sách tài khoản (Admin)
      operationId: list
      parameters:
        - name: approval
          in: query
          required: false
          schema:
            type: string
            enum:
              - WAITING
              - APPROVED
              - REJECTED
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - ACTIVE
              - LOCKED
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum:
              - ADMIN
              - USER
        - name: q
          in: query
          description: Tìm theo họ tên (không phân biệt hoa thường, dấu) hoặc email
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            maximum: 100
            minimum: 1
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseAccountAdminResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/members:
    get:
      tags:
        - members
      summary: Danh sách thành viên
      description: |
        Mọi tài khoản đã duyệt xem được. Tìm theo tên **không cần gõ dấu**. Các bộ lọc kết hợp bằng AND.
        `ageMin`/`ageMax` tính theo năm (còn sống: đến năm hiện tại; đã mất: đến năm mất dương). Người chưa rõ
        năm sinh, hoặc đã mất mà chưa rõ năm mất, không tính được tuổi nên bị loại khi có một trong hai tham số. `generation` và `onTree` lấy từ cây gia phả (cây trống thì
        không ai có đời và mọi người đều `onTree=false`).
      operationId: listMembers
      parameters:
        - name: q
          in: query
          description: Tìm theo họ tên, không phân biệt hoa thường và dấu
          required: false
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          description: |
            `name` tên A-Z (theo cả chuỗi họ tên); `age` lớn tuổi trước, người chưa rõ năm sinh xếp cuối;
            `created` mới thêm trước; `generation` đời nhỏ trước, người chưa lên cây xếp cuối.
          required: false
          schema:
            type: string
            enum:
              - name
              - age
              - created
              - generation
            default: name
        - name: ageMin
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 150
        - name: ageMax
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 150
        - name: generation
          in: query
          description: Đời (độ sâu trên cây, đời 1 là gốc)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: deceased
          in: query
          description: '`true` chỉ người đã mất, `false` chỉ người còn sống'
          required: false
          schema:
            type: boolean
        - name: onTree
          in: query
          description: '`true` chỉ người đã có trên cây, `false` chỉ người chưa có'
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            maximum: 100
            minimum: 1
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - members
      summary: Thêm thành viên
      description: |
        Chỉ Admin. Chỉ `fullName` là bắt buộc. Các trường về việc đã mất (`deathSolar`, `deathLunar`,
        `memorialOverride`, `burialPlace`) chỉ hợp lệ khi `isDeceased = true`, nếu không thì 400 `VALIDATION_ERROR`.
        Ngày mất gửi **một trong hai** (`deathSolar` hoặc `deathLunar`); có cả hai thì dùng `deathSolar`. Khi có năm, máy chủ
        tự tính ngày ở lịch còn lại và trả cả hai; `deathLunar` không có năm thì `deathSolar` là `null`.
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/members/{id}:
    get:
      tags:
        - members
      summary: Chi tiết thành viên
      description: |
        Mọi tài khoản đã duyệt xem được. `phone` và `email` chỉ có trong body khi người gọi là Admin
        hoặc chính chủ hồ sơ (`user.member_id`); với người khác hai trường này **không xuất hiện**.
      operationId: getMember
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - members
      summary: Sửa thành viên
      description: |
        Admin sửa mọi hồ sơ. User đã liên kết "Tôi là ai" chỉ sửa hồ sơ của chính mình (`user.member_id`), có hiệu lực ngay,
        và **không** được đổi nhóm "đã mất" (`isDeceased`, `deathSolar`, `deathLunar`, `memorialOverride`, `burialPlace`):
        khác giá trị hiện có thì 403 `DEATH_FIELDS_ADMIN_ONLY`. Người khác thì 403 `FORBIDDEN`.
        Ảnh đại diện không đổi qua API này mà qua `/api/files/confirm`. Quy tắc dữ liệu như `POST /api/members`.
      operationId: updateMember
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - members
      summary: Xóa thành viên
      description: |
        Chỉ Admin. Bị chặn nếu người đó đang có trên cây (409 `MEMBER_ON_TREE`): phải gỡ khỏi cây trước.
        Khi xóa: xóa các dòng người thân liên quan, gỡ liên kết tài khoản, xóa tệp đính kèm; audit log giữ bản sao đầy đủ.
      operationId: deleteMember
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Đã xóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/files/sign:
    post:
      tags:
        - files
      summary: Xin chữ ký để tải tệp lên Cloudinary
      description: |
        Chỉ Admin, trừ `kind = AVATAR` cho hồ sơ của chính User đã liên kết (`memberId = user.member_id`).
        Máy chủ kiểm MIME (jpg, png, webp, pdf, docx, xlsx; ảnh đại diện chỉ jpg/png/webp), tối đa 10 MB mỗi tệp và 1 GB toàn hệ thống.
        Lỗi: 400 `VALIDATION_ERROR`, 403 `FORBIDDEN`. Ở chế độ giả lập trả 503 "Cần kết nối máy chủ" (DECISIONS #72).
      operationId: signUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileSignRequest'
      responses:
        '200':
          description: Chữ ký có hiệu lực ngắn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSignResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/files/confirm:
    post:
      tags:
        - files
      summary: Xác nhận tệp đã tải lên Cloudinary
      description: |
        Máy chủ kiểm lại tệp trên Cloudinary rồi ghi nhận. Với `AVATAR`, ảnh cũ của hồ sơ bị thay và `avatarUrl` được cập nhật.
        Quyền như `/api/files/sign`.
      operationId: confirmUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileConfirmRequest'
      responses:
        '200':
          description: Đã ghi nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/members/{id}/relatives:
    get:
      tags:
        - relatives
      summary: Danh sách người thân của một hồ sơ
      description: |
        Mọi tài khoản đã duyệt xem được. Một chiều: chỉ có các dòng do chủ hồ sơ hoặc Admin khai trong hồ sơ này,
        hồ sơ bên kia không tự có dòng ngược lại. Sắp theo thời điểm thêm.
      operationId: listRelatives
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relative'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - relatives
      summary: Thêm người thân vào hồ sơ
      description: |
        Chủ hồ sơ (User đã liên kết, `user.member_id = id`) hoặc Admin; có hiệu lực ngay. `label` bắt buộc, cắt khoảng trắng hai đầu,
        tối đa 50 ký tự. Người thân phải là thành viên đã có. Lỗi: 400 `VALIDATION_ERROR` (nhãn, hoặc tự thêm chính mình),
        404 `MEMBER_NOT_FOUND`, 409 `RELATIVE_EXISTS` (người này đã có trong danh sách, muốn đổi nhãn thì sửa dòng cũ),
        403 `FORBIDDEN` (không phải chủ hồ sơ hay Admin).
      operationId: addRelative
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelativeInput'
      responses:
        '201':
          description: Đã thêm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relative'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/members/{id}/relatives/{relativeId}:
    put:
      tags:
        - relatives
      summary: Sửa nhãn của một người thân
      description: Chỉ đổi được `label` (quy tắc như khi thêm). Quyền như `POST`. 404 `RELATIVE_NOT_FOUND` khi dòng không thuộc hồ sơ này.
      operationId: updateRelative
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/RelativeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelativeLabelInput'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relative'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - relatives
      summary: Xóa một người thân khỏi hồ sơ
      description: Quyền như `POST`. Chỉ xóa dòng trong hồ sơ này, thành viên được nhắc tới vẫn giữ nguyên.
      operationId: deleteRelative
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/RelativeId'
      responses:
        '204':
          description: Đã xóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/link-requests:
    get:
      tags:
        - member-links
      summary: Danh sách yêu cầu liên kết (Admin)
      description: Hàng đợi duyệt của Admin. Cũ nhất trước.
      operationId: listLinkRequests
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LinkRequestStatus'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - member-links
      summary: Gửi yêu cầu "Đây là tôi"
      description: |
        Tài khoản đã duyệt yêu cầu liên kết với một thành viên; Admin duyệt thì mới có hiệu lực. Lỗi: 404 `MEMBER_NOT_FOUND`,
        409 `ACCOUNT_ALREADY_LINKED` (phải hủy liên kết cũ trước), 409 `MEMBER_ALREADY_LINKED` (thành viên đã có tài khoản khác),
        409 `LINK_REQUEST_EXISTS` (đang có yêu cầu chờ duyệt).
      operationId: createLinkRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkRequestInput'
      responses:
        '201':
          description: Đã gửi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/link-requests/mine:
    get:
      tags:
        - member-links
      summary: Các yêu cầu liên kết của tôi
      description: Mới nhất trước, gồm mọi trạng thái. Giao diện dùng dòng `PENDING` (nếu có) để hiện "đang chờ duyệt".
      operationId: myLinkRequests
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/link-requests/{id}/approve:
    post:
      tags:
        - member-links
      summary: Duyệt yêu cầu liên kết (Admin)
      description: |
        Gán `user.member_id`. Nếu hồ sơ chưa có email thì chép email tài khoản sang (một lần, DECISIONS #81).
        Lỗi: 404 `LINK_REQUEST_NOT_FOUND`, 409 `LINK_REQUEST_NOT_PENDING`, 409 `MEMBER_ALREADY_LINKED`, 409 `ACCOUNT_ALREADY_LINKED`.
      operationId: approveLinkRequest
      parameters:
        - $ref: '#/components/parameters/LinkRequestId'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/link-requests/{id}/reject:
    post:
      tags:
        - member-links
      summary: Từ chối yêu cầu liên kết (Admin)
      description: 'Lỗi: 404 `LINK_REQUEST_NOT_FOUND`, 409 `LINK_REQUEST_NOT_PENDING`.'
      operationId: rejectLinkRequest
      parameters:
        - $ref: '#/components/parameters/LinkRequestId'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/me/member-link:
    delete:
      tags:
        - member-links
      summary: Tự hủy liên kết của tôi
      description: Gỡ `user.member_id`. Không xóa email đã chép sang hồ sơ. 409 `NOT_LINKED` khi chưa liên kết.
      operationId: unlinkMe
      responses:
        '204':
          description: Đã hủy liên kết
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/accounts/{id}/member-link:
    put:
      tags:
        - admin-accounts
        - member-links
      summary: Admin gán thành viên cho tài khoản
      description: |
        Không cần yêu cầu. Chỉ tài khoản đã duyệt và đang hoạt động (409 `INVALID_ACCOUNT_STATE`). Lỗi khác: 404 `ACCOUNT_NOT_FOUND`
        hoặc `MEMBER_NOT_FOUND`, 409 `MEMBER_ALREADY_LINKED` (thành viên đã có tài khoản khác), 409 `ACCOUNT_ALREADY_LINKED`
        (tài khoản đã liên kết người khác, phải hủy trước). Yêu cầu "Đây là tôi" đang chờ của tài khoản đó tự chuyển sang hủy
        (`CANCELLED`). Chép email như khi duyệt yêu cầu (DECISIONS #81).
      operationId: adminLinkMember
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMemberLinkInput'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAdminResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - admin-accounts
        - member-links
      summary: Admin hủy liên kết của một tài khoản
      description: Hủy được của bất kỳ ai. Không xóa email đã chép sang hồ sơ. 409 `NOT_LINKED` khi tài khoản chưa liên kết.
      operationId: adminUnlinkMember
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAdminResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/tree:
    get:
      tags:
        - tree
      summary: Toàn bộ cây gia phả
      description: |
        Mọi tài khoản đã duyệt xem được. Trả toàn bộ đồ thị (nút và cạnh); **đời không nằm trong response**,
        frontend tự tính theo độ sâu (DECISIONS #34, #60). Cây trống thì cả hai mảng rỗng.

        Quy ước của đồ thị:
        - Ô **thuộc dòng** là ô không xuất hiện trong `spouses[].spouseNodeId`. Ô không có `parentNodeId` là **gốc**
          (có thể có nhiều gốc, mỗi gốc là Đời 01 của cây rời của nó).
        - Ô **vợ/chồng** là ô có trong `spouses[].spouseNodeId`. Ô này không có `parentNodeId` và không có vợ/chồng riêng.
        - Con của một cặp: `parentNodeId` luôn là ô **thuộc dòng**, `coParentNodeId` là ô vợ/chồng của ô đó
          (hoặc `null` khi con chỉ thuộc một mình cha/mẹ). Bấm "+ Con" trên ô vợ/chồng thì `parentNodeId` là ô thuộc dòng của ô đó.
        - `memberId = null` là ô trống (đã gỡ người ra khỏi cây); ô trống vẫn có thể có con và vợ/chồng.
        - Anh em (cùng `parentNodeId`, hoặc cùng là gốc) xếp theo `sortOrder` tăng dần, rồi theo `id`.
      operationId: getTree
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MemberId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RelativeId:
      name: relativeId
      in: path
      required: true
      description: '`id` của dòng người thân (không phải id của thành viên được nhắc tới)'
      schema:
        type: integer
        format: int64
        minimum: 1
    LinkRequestId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    ValidationError:
      description: 'Dữ liệu không hợp lệ (`VALIDATION_ERROR`, `MALFORMED_REQUEST`, lỗi lịch âm...)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Chưa đăng nhập, phiên hết hạn hoặc sai thông tin đăng nhập (`UNAUTHENTICATED`, `INVALID_CREDENTIALS`...)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Không có quyền (`FORBIDDEN`), tài khoản chưa được duyệt (`ACCOUNT_NOT_APPROVED`) hoặc bị khóa (`ACCOUNT_LOCKED`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Không tìm thấy (`ACCOUNT_NOT_FOUND`, `MEMBER_NOT_FOUND`, `RELATIVE_NOT_FOUND`, `LINK_REQUEST_NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: 'Xung đột trạng thái (`SELF_ACTION_FORBIDDEN`, `LAST_ADMIN`, `INVALID_ACCOUNT_STATE`, `MEMBER_ON_TREE`, `RELATIVE_EXISTS`, `MEMBER_ALREADY_LINKED`, `ACCOUNT_ALREADY_LINKED`, `LINK_REQUEST_EXISTS`, `LINK_REQUEST_NOT_PENDING`, `NOT_LINKED`)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TooManyRequests:
      description: Vượt giới hạn tần suất hoặc tài khoản bị khóa đăng nhập tạm (`LOGIN_LOCKED`, `RATE_LIMITED`, `OTP_RATE_LIMITED`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    ProblemDetail:
      type: object
      description: Lỗi theo RFC 9457; `detail` là thông báo tiếng Việt hiển thị được cho người dùng.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Mã lỗi máy đọc được, ví dụ `ACCOUNT_NOT_APPROVED`, `MEMBER_NOT_FOUND`.
        errors:
          type: array
          description: Lỗi theo từng trường (chỉ có khi `code = VALIDATION_ERROR` hoặc lỗi lịch âm).
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
        - field
        - message
    SolarDate:
      type: object
      description: Ngày dương đầy đủ.
      properties:
        year:
          type: integer
          format: int32
        month:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
        day:
          type: integer
          format: int32
          minimum: 1
          maximum: 31
      required:
        - year
        - month
        - day
    MemberLunarDate:
      type: object
      description: Ngày âm; `year` bỏ trống nghĩa là chỉ biết ngày/tháng (không tính "giỗ lần thứ N").
      properties:
        day:
          type: integer
          format: int32
          minimum: 1
          maximum: 30
        month:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
        leap:
          type: boolean
          description: Ngày thuộc tháng nhuận
        year:
          type:
            - integer
            - 'null'
          format: int32
      required:
        - day
        - month
        - leap
    MemberBirth:
      type: object
      description: Ngày sinh; được phép chỉ có năm. `calendar` là lịch dùng để tính sinh nhật hằng năm của người này.
      properties:
        year:
          type:
            - integer
            - 'null'
          format: int32
        month:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 1
          maximum: 12
        day:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 1
          maximum: 31
        calendar:
          type: string
          enum:
            - SOLAR
            - LUNAR
          default: SOLAR
        leap:
          type: boolean
          description: Chỉ có nghĩa khi `calendar = LUNAR`
      required:
        - calendar
        - leap
    MemorialOverride:
      type: object
      description: Ngày giỗ ghi đè (âm lịch, không nhuận), dùng thay cho ngày mất khi gia đình cúng ngày khác.
      properties:
        day:
          type: integer
          format: int32
          minimum: 1
          maximum: 30
        month:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
      required:
        - day
        - month
    MemberSummary:
      type: object
      description: Dòng trong danh sách thành viên. Họ tên ghi nguyên văn, kể cả "Cụ", "Ông", "Bà", "(Tức ...)".
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        gender:
          type:
            - string
            - 'null'
          enum:
            - M
            - F
            - null
          description: Được để trống
        avatarUrl:
          type:
            - string
            - 'null'
        labels:
          type: array
          description: Nhãn đặc biệt, ví dụ "Liệt sỹ"
          items:
            type: string
        birthYear:
          type:
            - integer
            - 'null'
          format: int32
        isDeceased:
          type: boolean
        deathYear:
          type:
            - integer
            - 'null'
          format: int32
          description: Năm mất theo dương lịch (nếu biết)
        generation:
          type:
            - integer
            - 'null'
          format: int32
          description: Đời = độ sâu trên cây; `null` khi chưa có trên cây
        onTree:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fullName
        - gender
        - avatarUrl
        - labels
        - birthYear
        - isDeceased
        - deathYear
        - generation
        - onTree
        - createdAt
    MemberDetail:
      description: Hồ sơ đầy đủ của một thành viên.
      allOf:
        - $ref: '#/components/schemas/MemberSummary'
        - type: object
          properties:
            tabooName:
              type:
                - string
                - 'null'
              description: Tên húy
            phone:
              type:
                - string
                - 'null'
              description: Chỉ có khi người gọi là Admin hoặc chính chủ; người khác không nhận trường này.
            email:
              type:
                - string
                - 'null'
              description: Chỉ có khi người gọi là Admin hoặc chính chủ; người khác không nhận trường này.
            biography:
              type:
                - string
                - 'null'
            birth:
              oneOf:
                - $ref: '#/components/schemas/MemberBirth'
                - type: 'null'
              description: '`null` khi chưa biết gì về ngày sinh'
            deathSolar:
              oneOf:
                - $ref: '#/components/schemas/SolarDate'
                - type: 'null'
              description: Ngày mất theo dương; tự tính từ ngày mất âm khi có năm, `null` khi chưa có.
            deathLunar:
              oneOf:
                - $ref: '#/components/schemas/MemberLunarDate'
                - type: 'null'
              description: Ngày mất theo âm (nguồn nhập của dữ liệu ban đầu); `null` khi chưa có.
            memorialOverride:
              oneOf:
                - $ref: '#/components/schemas/MemorialOverride'
                - type: 'null'
            burialPlace:
              type:
                - string
                - 'null'
            updatedAt:
              type: string
              format: date-time
          required:
            - tabooName
            - biography
            - birth
            - deathSolar
            - deathLunar
            - memorialOverride
            - burialPlace
            - updatedAt
    MemberInput:
      type: object
      description: |
        Nội dung hồ sơ khi thêm hoặc sửa (PUT thay toàn bộ, trường bỏ trống nghĩa là xóa giá trị).
        Họ tên ghi nguyên văn. Không có `avatarUrl`: ảnh đại diện đổi qua `/api/files/confirm`.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        gender:
          type:
            - string
            - 'null'
          enum:
            - M
            - F
            - null
        tabooName:
          type:
            - string
            - 'null'
          maxLength: 200
        labels:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 50
        biography:
          type:
            - string
            - 'null'
          maxLength: 5000
        phone:
          type:
            - string
            - 'null'
          maxLength: 30
        email:
          type:
            - string
            - 'null'
          maxLength: 254
        birth:
          oneOf:
            - $ref: '#/components/schemas/MemberBirth'
            - type: 'null'
        isDeceased:
          type: boolean
        deathSolar:
          oneOf:
            - $ref: '#/components/schemas/SolarDate'
            - type: 'null'
        deathLunar:
          oneOf:
            - $ref: '#/components/schemas/MemberLunarDate'
            - type: 'null'
        memorialOverride:
          oneOf:
            - $ref: '#/components/schemas/MemorialOverride'
            - type: 'null'
        burialPlace:
          type:
            - string
            - 'null'
          maxLength: 300
      required:
        - fullName
        - isDeceased
    FileKind:
      type: string
      enum:
        - AVATAR
        - DOCUMENT
    FileSignRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/FileKind'
        memberId:
          type:
            - integer
            - 'null'
          format: int64
          description: Bắt buộc với AVATAR; `null` với DOCUMENT nghĩa là tài liệu chung
        fileName:
          type: string
          maxLength: 255
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
      required:
        - kind
        - fileName
        - mimeType
        - sizeBytes
    FileSignResponse:
      type: object
      properties:
        uploadUrl:
          type: string
          description: Địa chỉ Cloudinary để gửi `multipart/form-data`
        fields:
          type: object
          description: Các trường đã ký (api_key, timestamp, signature, folder, public_id...), gửi kèm trường `file`
          additionalProperties:
            type: string
      required:
        - uploadUrl
        - fields
    FileConfirmRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/FileKind'
        memberId:
          type:
            - integer
            - 'null'
          format: int64
        publicId:
          type: string
          description: '`public_id` Cloudinary trả về sau khi tải lên'
        fileName:
          type: string
          maxLength: 255
      required:
        - kind
        - publicId
        - fileName
    Attachment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/FileKind'
        memberId:
          type:
            - integer
            - 'null'
          format: int64
        url:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - kind
        - memberId
        - url
        - fileName
        - mimeType
        - sizeBytes
        - createdAt
    MemberPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberSummary'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
    ConsentRequest:
      type: object
      properties:
        acceptTerms:
          type: boolean
      required:
        - acceptTerms
    MeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        fullName:
          type: string
        avatarUrl:
          type: string
        systemRole:
          type: string
          enum:
            - ADMIN
            - USER
        status:
          type: string
          enum:
            - PENDING
            - ACTIVE
            - LOCKED
        approvalStatus:
          type: string
          enum:
            - WAITING
            - APPROVED
            - REJECTED
        consentRequired:
          type: boolean
        familyId:
          type: integer
          format: int64
          deprecated: true
          description: Còn do backend Đợt 8 trả về. Frontend đọc lần cuối ở Đợt 10, backend bỏ ở Đợt 26.
        familyRole:
          type: string
          enum:
            - MANAGER
            - MEMBER
          deprecated: true
          description: Như `familyId`.
        memberId:
          type: integer
          format: int64
          description: Thành viên mà tài khoản đã liên kết ("Tôi là ai"); không có nghĩa là chưa liên kết.
        hideMaternalLine:
          type: boolean
          deprecated: true
          description: Như `familyId`.
        createdAt:
          type: string
          format: date-time
    VerifyOtpRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
          pattern: ^[A-Za-z0-9._%+'-]+@[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*[.][A-Za-z]{2,}$
        otp:
          type: string
          minLength: 1
          pattern: '[0-9]{6}'
      required:
        - email
        - otp
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/MeResponse'
    ResetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
          pattern: ^[A-Za-z0-9._%+'-]+@[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*[.][A-Za-z]{2,}$
        otp:
          type: string
          minLength: 1
          pattern: '[0-9]{6}'
        newPassword:
          type: string
          maxLength: 72
          minLength: 8
        confirmPassword:
          type: string
          minLength: 1
      required:
        - confirmPassword
        - email
        - newPassword
        - otp
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
          pattern: ^[A-Za-z0-9._%+'-]+@[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*[.][A-Za-z]{2,}$
      required:
        - email
    OtpSentResponse:
      type: object
      properties:
        email:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
        resendAfterSeconds:
          type: integer
          format: int64
    RegisterRequest:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 100
          minLength: 0
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
          pattern: ^[A-Za-z0-9._%+'-]+@[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*[.][A-Za-z]{2,}$
        password:
          type: string
          maxLength: 72
          minLength: 8
        confirmPassword:
          type: string
          minLength: 1
        acceptTerms:
          type: boolean
      required:
        - acceptTerms
        - confirmPassword
        - email
        - fullName
        - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 0
          pattern: ^[A-Za-z0-9._%+'-]+@[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*[.][A-Za-z]{2,}$
        password:
          type: string
          maxLength: 200
          minLength: 0
      required:
        - email
        - password
    GoogleLoginRequest:
      type: object
      properties:
        idToken:
          type: string
          maxLength: 4096
          minLength: 0
      required:
        - idToken
    AccountAdminResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        fullName:
          type: string
        avatarUrl:
          type: string
        systemRole:
          type: string
          enum:
            - ADMIN
            - USER
        status:
          type: string
          enum:
            - PENDING
            - ACTIVE
            - LOCKED
        lockReason:
          type: string
          enum:
            - MANUAL
            - MEMBER_LOCKED
        approvalStatus:
          type: string
          enum:
            - WAITING
            - APPROVED
            - REJECTED
        approvedBy:
          type: integer
          format: int64
        approvedAt:
          type: string
          format: date-time
        memberId:
          type: integer
          format: int64
        member:
          oneOf:
            - $ref: '#/components/schemas/LinkedMember'
            - type: 'null'
          description: Thành viên đang liên kết ("Tôi là ai"); `null` khi chưa liên kết (DECISIONS #80).
        createdAt:
          type: string
          format: date-time
    LunarMonthInfoResponse:
      type: object
      properties:
        year:
          type: integer
          format: int32
        month:
          type: integer
          format: int32
        leap:
          type: boolean
        days:
          type: integer
          format: int32
        firstDay:
          type: string
          format: date
        lastDay:
          type: string
          format: date
        yearLeapMonth:
          type: integer
          format: int32
    ConvertResponse:
      type: object
      properties:
        solar:
          type: string
          format: date
        lunar:
          $ref: '#/components/schemas/LunarDateResponse'
    LunarDateResponse:
      type: object
      properties:
        year:
          type: integer
          format: int32
        month:
          type: integer
          format: int32
        day:
          type: integer
          format: int32
        leap:
          type: boolean
    LinkedMember:
      type: object
      description: Thành viên rút gọn (id và họ tên ghi nguyên văn), đủ để hiện link tới hồ sơ.
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
      required:
        - id
        - fullName
    Relative:
      type: object
      description: 'Một dòng trong danh sách người thân của hồ sơ: trong hồ sơ này, `relative` là "`label`". Ví dụ "Cụ Nguyễn Văn Uyên — cha".'
      properties:
        id:
          type: integer
          format: int64
        relative:
          $ref: '#/components/schemas/MemberSummary'
        label:
          type: string
          maxLength: 50
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - relative
        - label
        - createdAt
    RelativeInput:
      type: object
      properties:
        relativeMemberId:
          type: integer
          format: int64
          minimum: 1
        label:
          type: string
          description: Bắt buộc, cắt khoảng trắng hai đầu, tối đa 50 ký tự.
          maxLength: 50
      required:
        - relativeMemberId
        - label
    RelativeLabelInput:
      type: object
      properties:
        label:
          type: string
          description: Bắt buộc, cắt khoảng trắng hai đầu, tối đa 50 ký tự.
          maxLength: 50
      required:
        - label
    LinkRequestStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
        - CANCELLED
      description: '`CANCELLED` khi Admin gán trực tiếp cho tài khoản đó, hoặc thành viên bị xóa.'
    LinkRequest:
      type: object
      description: Yêu cầu "Đây là tôi" của một tài khoản.
      properties:
        id:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        accountFullName:
          type: string
        accountEmail:
          type: string
        member:
          $ref: '#/components/schemas/LinkedMember'
        status:
          $ref: '#/components/schemas/LinkRequestStatus'
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - id
        - accountId
        - accountFullName
        - accountEmail
        - member
        - status
        - createdAt
        - decidedAt
    LinkRequestInput:
      type: object
      properties:
        memberId:
          type: integer
          format: int64
          minimum: 1
      required:
        - memberId
    AdminMemberLinkInput:
      type: object
      properties:
        memberId:
          type: integer
          format: int64
          minimum: 1
      required:
        - memberId
    TreeMember:
      type: object
      description: Tóm tắt thành viên hiển thị trong ô của cây. Họ tên ghi nguyên văn.
      properties:
        fullName:
          type: string
        gender:
          type:
            - string
            - 'null'
          enum:
            - M
            - F
            - null
          description: Được để trống; ô của người chưa rõ giới tính vẽ trung tính
        avatarUrl:
          type:
            - string
            - 'null'
        labels:
          type: array
          description: Nhãn đặc biệt, ví dụ "Liệt sỹ"
          items:
            type: string
        birthYear:
          type:
            - integer
            - 'null'
          format: int32
        isDeceased:
          type: boolean
        deathYear:
          type:
            - integer
            - 'null'
          format: int32
          description: Năm mất theo dương lịch (nếu biết)
      required:
        - fullName
        - gender
        - avatarUrl
        - labels
        - birthYear
        - isDeceased
        - deathYear
    TreeNode:
      type: object
      description: Một ô trên cây. Đời không có trong DTO (tính theo độ sâu ở frontend).
      properties:
        id:
          type: integer
          format: int64
        memberId:
          type:
            - integer
            - 'null'
          format: int64
          description: '`null` là ô trống. Mỗi thành viên có tối đa một ô trên cây.'
        member:
          description: Tóm tắt thành viên; `null` khi là ô trống (khớp với `memberId`)
          oneOf:
            - $ref: '#/components/schemas/TreeMember'
            - type: 'null'
        parentNodeId:
          type:
            - integer
            - 'null'
          format: int64
          description: Ô cha/mẹ **thuộc dòng**; `null` với gốc và với ô vợ/chồng
        coParentNodeId:
          type:
            - integer
            - 'null'
          format: int64
          description: Ô vợ/chồng của `parentNodeId` cùng sinh ra ô này; `null` khi chỉ thuộc một mình cha/mẹ
        sortOrder:
          type: integer
          format: int32
          description: Thứ tự anh em, nhỏ trước
      required:
        - id
        - memberId
        - member
        - parentNodeId
        - coParentNodeId
        - sortOrder
    TreeSpouse:
      type: object
      description: Quan hệ vợ/chồng của một ô thuộc dòng. Mỗi ô vợ/chồng thuộc đúng một ô thuộc dòng.
      properties:
        nodeId:
          type: integer
          format: int64
          description: Ô thuộc dòng
        spouseNodeId:
          type: integer
          format: int64
          description: Ô vợ/chồng
        order:
          type: integer
          format: int32
          minimum: 1
          description: Thứ tự vợ/chồng (1 = Cả, 2 = Hai...)
      required:
        - nodeId
        - spouseNodeId
        - order
    TreeResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TreeNode'
        spouses:
          type: array
          items:
            $ref: '#/components/schemas/TreeSpouse'
      required:
        - nodes
        - spouses
    PageResponseAccountAdminResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountAdminResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
