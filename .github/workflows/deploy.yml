name: Deploy

# Thủ công hoặc khi đẩy tag v* (DECISIONS #41, #87)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR yêu cầu tên image chữ thường
      - name: Owner chữ thường
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push app (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/giapha-app:latest
            ghcr.io/${{ env.OWNER }}/giapha-app:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build + push web (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/nginx/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ghcr.io/${{ env.OWNER }}/giapha-web:latest
            ghcr.io/${{ env.OWNER }}/giapha-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: SSH vào VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "SSH_OPTS=-i $HOME/.ssh/deploy_key" >> "$GITHUB_ENV"

      - name: Cập nhật compose + pull + up
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          scp $SSH_OPTS infra/docker-compose.prod.yml "$SSH_USER@$SSH_HOST:/opt/giapha/docker-compose.prod.yml"
          scp $SSH_OPTS infra/backup/backup.sh "$SSH_USER@$SSH_HOST:/opt/giapha/backup/backup.sh"
          # token đi qua stdin, không nằm trên dòng lệnh
          printf '%s' "$GHCR_TOKEN" | ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin && cd /opt/giapha \
             && docker compose -f docker-compose.prod.yml pull \
             && docker compose -f docker-compose.prod.yml up -d --remove-orphans \
             && docker image prune -f"
