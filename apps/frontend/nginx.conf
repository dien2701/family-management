server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    # Không cho công cụ tìm kiếm lập chỉ mục (DECISIONS #88); location có add_header riêng phải lặp lại dòng này
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Nén Gzip tăng tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 0. Trợ lý AI (SSE): không buffer để chữ chạy dần
    location = /api/ai/chat {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # 1. Reverse proxy các API call sang Spring Boot backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Không cache service worker và index.html để đảm bảo cập nhật PWA mới nhất
    location ~* (sw\.ts|sw\.js|index\.html|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html;
    }

    # 3. Cache dài hạn các asset tĩnh có hash tên file
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # 4. Điều hướng SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
