<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#24466F" />
    <title>Tộc Phả</title>
    <script>
      // Áp giao diện đã lưu trước khi React chạy để không nháy sáng (logic đầy đủ ở src/hooks/useTheme.ts)
      try {
        var m = localStorage.getItem('tocpha.theme') || 'system'
        var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        var f = localStorage.getItem('tocpha.fontSize')
        if (f === 'large' || f === 'xlarge') document.documentElement.dataset.fontSize = f
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
