spring:
  application:
    name: giapha-backend
  config:
    # Đọc bí mật từ apps/backend/.env khi chạy local; trên prod dùng biến môi trường thật
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:giapha}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&connectionCollation=utf8mb4_0900_ai_ci
    username: ${DB_USERNAME:giapha}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    from: ${MAIL_FROM:no-reply@giapha.local}
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:mailto:admin@example.com}
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    thinking-budget: ${GEMINI_THINKING_BUDGET:0}
  file:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  auth:
    # false = tạm tắt việc Admin duyệt tài khoản: tài khoản mới vào dùng ngay, tài khoản đang chờ duyệt được tự duyệt khi khởi động
    require-approval: ${REQUIRE_ACCOUNT_APPROVAL:false}
  root-admin-email: ${ROOT_ADMIN_EMAIL:}
