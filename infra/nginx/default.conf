server_tokens off;

# Docker DNS: nginx phân giải lại tên "app" sau mỗi lần app được tạo lại (deploy)
resolver 127.0.0.11 valid=10s;

# --- HTTP: ACME + chuyển sang HTTPS ---
server {
    listen 80;
    server_name giapha.click www.giapha.click;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # healthcheck của compose
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        return 301 https://giapha.click$request_uri;
    }
}

# --- www -> gốc ---
server {
    listen 443 ssl;
    http2 on;
    server_name www.giapha.click;

    ssl_certificate     /etc/letsencrypt/live/giapha.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/giapha.click/privkey.pem;

    return 301 https://giapha.click$request_uri;
}

# --- Site chính ---
server {
    listen 443 ssl;
    http2 on;
    server_name giapha.click;

    ssl_certificate     /etc/letsencrypt/live/giapha.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/giapha.click/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # Upload file đi thẳng lên Cloudinary; chỉ chừa dư cho JSON/đề xuất
    client_max_body_size 12m;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/manifest+json;

    # Trợ lý AI (SSE): không buffer, không nén, giữ kết nối lâu
    location = /api/ai/chat {
        set $upstream app:8080;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx là lớp ngoài cùng nên đặt bằng IP thật, không nối thêm giá trị client tự gửi
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/ {
        set $upstream app:8080;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Service worker, index.html, manifest: luôn kiểm tra bản mới để PWA cập nhật
    location ~* (sw\.js|registerSW\.js|index\.html|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }

    # Asset có hash trong tên: cache 1 năm
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
